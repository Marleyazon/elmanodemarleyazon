<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Baloo 2','Nunito',Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html{
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:none;
}

body{
    background:linear-gradient(180deg,#58cc02,#46a302);
    min-height:100vh;
    min-height:100dvh;
    color:white;
    padding-bottom:calc(90px + env(safe-area-inset-bottom));

}

button, .lesson-btn, .choice-btn{

    touch-action:manipulation;
}

.top{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top));
    font-size:14px;
    font-weight:800;
    color:#333;
    background:linear-gradient(180deg,#58cc02 60%, rgba(88,204,2,0.85));

    row-gap:6px;
}

.top > div{
    background:rgba(255,255,255,0.95);
    color:#4b4b4b;
    padding:8px 12px;
    border-radius:20px;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);

}

h1{
    text-align:center;
    margin-top:15px;
    font-size:42px;
    font-weight:800;
    letter-spacing:0.5px;

}

.sous{
    text-align:center;
    font-size:17px;
    font-weight:600;
    opacity:0.95;
    margin-top:5px;
    margin-bottom:20px;
    padding:0 20px;
}

.banner{
    width:420px;
    max-width:90%;
    margin:15px auto;
    background:linear-gradient(135deg, #ff9800, #ff5722);
    color:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.global-banner{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:#ffcc00;
    color:#333;
    padding:12px 25px;
    border-radius:15px;
    font-weight:bold;
    font-size:16px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    z-index:9999;
    display:none;
    text-align:center;
}

.carte{
    width:420px;
    max-width:92%;
    margin:20px auto;
    background:white;
    color:#333;
    border-radius:24px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.carte h2{
    color:#58cc02;
    margin-bottom:15px;
    font-weight:800;
}

.carte p{
    margin-bottom:20px;
    font-size:18px;
    font-weight:600;
    line-height:1.4;
}

input, select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:2px solid #e5e5e5;
    border-radius:15px;
    font-size:16px;
    font-family:inherit;
    font-weight:600;
    color:#333;
    background:#fff;
}

input:focus, select:focus{
    outline:none;
    border-color:#58cc02;
}

button.main-btn{
    background:#58cc02;
    color:white;
    border:none;
    border-bottom:5px solid #46a302;
    border-radius:16px;
    padding:16px 40px;
    font-size:18px;
    font-weight:800;
    letter-spacing:0.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:0.08s;
    width:100%;
    margin-top:10px;
}

button.main-btn:active{
    transform:translateY(4px);
    border-bottom-width:1px;
}

.progress-wrap{
    width:100%;
    background:rgba(255,255,255,0.4);
    border-radius:20px;
    height:16px;
    margin:6px 0 0 0;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#ffc800;
    border-radius:20px;

}

.feedback-banner{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    align-items:center;
    justify-content:space-between;

.feedback-banner.correct{ background:#d7ffb8; }
.feedback-banner.incorrect{ background:#ffdfe0; }

.feedback-banner .fb-text{
    text-align:left;
}

.feedback-banner .fb-title{
    font-size:19px;

}

.feedback-banner.correct .fb-title{ color:#58a700; }
.feedback-banner.incorrect .fb-title{ color:#ea2b2b; }

.feedback-banner .fb-sub{

}

.feedback-banner button{

    font-weight:800;

.feedback-banner.correct button{ background:#58cc02; color:white; border-bottom:4px solid #46a302; }
.feedback-banner.incorrect button{ background:#ea2b2b; color:white; border-bottom:4px solid #b71c1c; }

@keyframes slideUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
}

.choice-btn.is-correct{
    background:#d7ffb8 !important;
    border-color:#58cc02 !important;
    color:#3c8e00;
}

.choice-btn.is-incorrect{
    background:#ffdfe0 !important;
    border-color:#ea2b2b !important;
    color:#b91c1c;
}

.lesson-path{

    align-items:center;
    gap:20px;
    margin:30px 0;
}

.chapter-banner{
    width:100%;

    font-weight:800;
    font-size:15px;

    border-radius:14px;

.lesson-btn{
    width:78px;
    height:78px;

    min-height:64px;
    border-radius:50%;
    background:#58cc02;
    color:white;
    border:none;
    font-size:22px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 0 #46a302;
    transition:0.08s;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.lesson-btn:nth-child(6n+2){ margin-left:50px; }
.lesson-btn:nth-child(6n+3){ margin-left:80px; }
.lesson-btn:nth-child(6n+4){ margin-left:50px; }
.lesson-btn:nth-child(6n+6){ margin-left:-50px; }
.lesson-btn:nth-child(6n+7){ margin-left:-80px; }
.lesson-btn:nth-child(6n+8){ margin-left:-50px; }

@media (max-width:380px){
    .lesson-btn:nth-child(6n+2){ margin-left:30px; }

    .lesson-btn:nth-child(6n+4){ margin-left:30px; }
    .lesson-btn:nth-child(6n+6){ margin-left:-30px; }
    .lesson-btn:nth-child(6n+7){ margin-left:-48px; }
    .lesson-btn:nth-child(6n+8){ margin-left:-30px; }

    justify-content:center;

    transform:translateY(3px);

}

.chest-node.locked{
    background:#e5e5e5;
    color:#afafaf;
    box-shadow:0 6px 0 #cccccc;
    cursor:not-allowed;
}

.chest-node.opened{
    opacity:0.55;
}

.choice-btn{
    background:white;
    color:#333;
    border:2px solid #e5e5e5;
    border-bottom:4px solid #e5e5e5;
    border-radius:16px;
    padding:16px;
    font-size:18px;
    font-weight:700;
    margin:8px 0;
    cursor:pointer;
    width:100%;
    min-height:52px;

.choice-btn:active{
    transform:translateY(2px);
    border-bottom-width:2px;
    background:#f7f7f7;
    border-color:#58cc02;

.error-msg{

    margin-top:10px;

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:12px 6px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    color:#58cc02;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 -5px 15px rgba(0,0,0,0.1);
    z-index:100;

.bottom div{

    transition:.15s;
    padding:6px 10px;
    border-radius:12px;
    line-height:1;

.bottom div:active{
    transform:scale(0.85);
    background:#f0fbe6;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

.modal-card{
    background:white;
    color:#333;
    border-radius:24px;
    padding:30px 25px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
}

.modal-card h2{
    margin-bottom:12px;
    font-weight:800;
}

.modal-card p{
    margin-bottom:16px;
    font-size:16px;
    font-weight:600;
    line-height:1.4;
    color:#333;
}

@keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-3px, 0px) rotate(-1deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    80% { transform: translate(1px, -1px) rotate(1deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
}

.chest-anim {
    font-size: 80px;
    animation: shake 0.5s infinite;
    margin: 20px 0;
}
</style>

function getChapitre(num){
    if(num <= 10) return {id:1, nom:"La politesse", mult:1, pertemult:1};
    if(num <= 20) return {id:2, nom:"Le vocabulaire de base", mult:2, pertemult:3};
    return {id:3, nom:"Former des phrases simples", mult:4, pertemult:9};
}

function getMaxLecons(){ return 35; }

function dateStr(d){ return d.toISOString().slice(0,10); }

function joursEntre(d1, d2){
    let t1 = new Date(d1 + "T00:00:00Z").getTime();
    let t2 = new Date(d2 + "T00:00:00Z").getTime();
    return Math.round((t2 - t1) / 86400000);
}

let globalSettings = JSON.parse(localStorage.getItem("maLangueGlobalSettings")) || {
    luckMultiplier: 1,
    globalMsgText: "",
    globalMsgTime: 0
};

let users = JSON.parse(localStorage.getItem("maLangueUsers")) || {};
let etat = JSON.parse(localStorage.getItem("maLangueEtat")) || {
    langue: "Elmaño",
    pseudo: "",
    diamants: 0,
    feu: 0,
    leconActuelle: 1,
    leconEnCours: null,
    freeSkips: 0,
    gelSerie1J: 0,
    gelSerie2J: 0,
    usedCodes: [],
    vies: 3,
    infiniteLivesActive: false,
    infiniteLivesExpiry: 0,
    dernierePerteVie: null,
    coffresOouverts: [],
    levelSkipPurchases: 0,
    lastActiveDate: null,
    streakBroken: false,
    previousStreakValue: 0,
    mythicCompleted: [],
    coffresGratuits: 0
};

function verifierVies(){
    if(etat.vies === undefined || etat.vies === null || isNaN(etat.vies)){
        etat.vies = 3;
    }
    if(etat.infiniteLivesActive){
        if(Date.now() > etat.infiniteLivesExpiry){
            etat.infiniteLivesActive = false;
        } else {
            etat.vies = 3;
            return;
        }
    }
    
    let intervalVie = 2 * 60 * 60 * 1000;
    if(etat.vies < 3 && etat.dernierePerteVie){
        let maintenant = Date.now();
        let tempsEcoule = maintenant - etat.dernierePerteVie;
        let viesGagnees = Math.floor(tempsEcoule / intervalVie);
        if(viesGagnees > 0){
            etat.vies = Math.min(3, etat.vies + viesGagnees);
            etat.dernierePerteVie = etat.vies < 3 ? etat.dernierePerteVie + (viesGagnees * intervalVie) : null;
            sauvegarder();
        }
    }
}

function verifierSerie(){
    let aujourdHui = dateStr(new Date());
    if(!etat.lastActiveDate){ return; }
    if(etat.lastActiveDate === aujourdHui){ return; }
    let diff = joursEntre(etat.lastActiveDate, aujourdHui);
    if(diff <= 1){ return; }
    let joursManques = diff - 1;
    let gelsDisponibles = (etat.gelSerie1J || 0) + (etat.gelSerie2J || 0) * 2;
    if(gelsDisponibles >= joursManques){
        let aConsommer = joursManques;
        while(aConsommer > 0 && etat.gelSerie2J > 0){ etat.gelSerie2J--; aConsommer -= 2; }
        while(aConsommer > 0 && etat.gelSerie1J > 0){ etat.gelSerie1J--; aConsommer -= 1; }
        let hier = new Date();
        hier.setUTCDate(hier.getUTCDate() - 1);
        etat.lastActiveDate = dateStr(hier);
    } else {
        if(etat.feu > 0){
            etat.previousStreakValue = etat.feu;
            etat.streakBroken = true;
        }
        etat.feu = 0;
        etat.gelSerie1J = 0;
        etat.gelSerie2J = 0;
        etat.lastActiveDate = null;
    }
    sauvegarder();
}

function enregistrerActiviteJournaliere(){
    let aujourdHui = dateStr(new Date());
    if(etat.lastActiveDate !== aujourdHui){
        etat.feu = (etat.feu || 0) + 1;
        etat.lastActiveDate = aujourdHui;
        etat.streakBroken = false;
    }
}

function sauvegarder(){
    if(etat.vies === undefined || etat.vies === null || isNaN(etat.vies)){
        etat.vies = 3;
    }
    etat.coffresOouverts = etat.coffresOouverts || [];
    etat.levelSkipPurchases = etat.levelSkipPurchases || 0;
    etat.mythicCompleted = etat.mythicCompleted || [];
    etat.coffresGratuits = etat.coffresGratuits || 0;
    etat.streakBroken = etat.streakBroken || false;

function obtenirDonneesLecons(num){
    let chapitre = getChapitre(num);
    let contenu = contenuLangues[etat.langue] || contenuLangues["Elmaño"];
    let questions = [];

    let count = 10;
    if(num === 1) count = 2;
    else if(num === 2) count = 3;
    else if(num === 3) count = 5;
    else if(num >= 4 && num <= 20) count = 10;
    else if(num >= 21 && num <= 35) count = 15;

    if(chapitre.id === 3){
        let phrasesEx = contenu.phrases;
        for(let i = 0; i < count; i++){
            let phraseItem = phrasesEx[(num + i) % phrasesEx.length];
            let wrongPhrase1 = phrasesEx[(i + 1) % phrasesEx.length].trad;
            let wrongPhrase2 = phrasesEx[(i + 2) % phrasesEx.length].trad;
            let typeEx = i % 3;

            if(typeEx === 0){
                questions.push({
                    type: "choice",
                    question: 'Comment traduit-on la phrase "' + phraseItem.mot + '" en ' + etat.langue + ' ?',
                    options: [phraseItem.trad, wrongPhrase1, wrongPhrase2],
                    correct: 0
                });
            } else if(typeEx === 1){
                questions.push({
                    type: "input",
                    question: 'Ecris la traduction exacte de la phrase "' + phraseItem.mot + '" en ' + etat.langue + ' :',
                    correct: phraseItem.trad
                });
            } else {
                let motsTrad = phraseItem.trad.split(' ');
                let motsMelanges = [...motsTrad].sort(() => Math.random() - 0.5);
                questions.push({
                    type: "reorder",
                    question: 'Remets les mots dans le bon ordre pour traduire "' + phraseItem.mot + '" :',
                    words: motsMelanges,
                    correct: phraseItem.trad
                });
            }
        }
    } else {
        let pool = chapitre.id === 1 ? contenu.politesse : contenu.vocabulaire;
        let allKeys = Object.keys(pool);

        for(let i = 0; i < count; i++){
            let wordKey = (((num - 1) * 2 + i) % allKeys.length) + 1;
            let item = pool[wordKey] || pool[1];

            let otherKeys = allKeys.filter(k => k != wordKey);
            let wrongKey1 = otherKeys[i % otherKeys.length];
            let wrongKey2 = otherKeys[(i + 1) % otherKeys.length];
            let wrong1 = pool[wrongKey1].trad;
            let wrong2 = pool[wrongKey2].trad;

            let typeEx = (num + i) % 5;

            if(typeEx === 0){
                questions.push({
                    type: "choice",
                    question: 'Comment dit-on "' + item.mot + '" en ' + etat.langue + ' ?',
                    options: [item.trad, wrong1, wrong2],
                    correct: 0
                });
            } else if(typeEx === 1){
                questions.push({
                    type: "input",
                    question: 'Ecris la traduction exacte de "' + item.mot + '" en ' + etat.langue + ' :',
                    correct: item.trad
                });
            } else if(typeEx === 2){
                let fauxTrad = (i % 2 === 0) ? wrong1 : item.trad;
                let estVrai = (fauxTrad === item.trad);
                questions.push({
                    type: "choice",
                    question: 'Vrai ou Faux : "' + item.mot + '" se traduit par "' + fauxTrad + '" en ' + etat.langue + ' ?',
                    options: ["Vrai", "Faux"],
                    correct: estVrai ? 0 : 1
                });
            } else if(typeEx === 3){
                let motMelange = item.trad.split('').sort(() => Math.random() - 0.5).join('');
                if(motMelange === item.trad) motMelange = item.trad.split('').reverse().join('');
                questions.push({
                    type: "input",
                    question: 'Remets les lettres dans le bon ordre pour traduire "' + item.mot + '" : ' + motMelange,
                    correct: item.trad
                });
            } else {
                let motsTrad = item.trad.split(' ');
                if(motsTrad.length > 1){
                    let motsMelanges = [...motsTrad].sort(() => Math.random() - 0.5);
                    questions.push({
                        type: "reorder",
                        question: 'Remets les mots dans le bon ordre pour traduire "' + item.mot + '" :',
                        words: motsMelanges,
                        correct: item.trad
                    });
                } else {
                    questions.push({
                        type: "input",
                        question: 'Ecris la traduction exacte de "' + item.mot + '" en ' + etat.langue + ' :',
                        correct: item.trad
                    });
                }
            }
        }
    }
    return questions;
}

function accepterMythique(num){
    const modal = document.getElementById('mythic-modal');
    let questions = obtenirDonneesLecons(num);
    let coutParQuestion = num === 1 ? 1 : (num === 2 ? 50 : (num === 3 ? 100 : 150));
    let coutTotal = coutParQuestion * questions.length;

    if(etat.diamants < coutTotal){
        if(modal) modal.remove();
        alert("Pas assez de diamants pour le Mode Mythique ! (" + coutTotal + " 💎 necessaires)");
        afficherAccueil();
        return;
    }

    etat.diamants -= coutTotal;
    sauvegarder();
    if(modal) modal.remove();

    mythicActive = true;
    mythicVies = 1;
    mythicNumLecon = num;
    mythicTotalQuestions = questions.length;
    etat.leconEnCours = num;
    currentQuestionIndex = 0;
    currentChapitre = getChapitre(num);
    erreursLecon = 0;
    currentSelectedWords = [];
    activeQuestions = [...questions].sort(() => Math.random() - 0.5);

    afficherQuestion();
}

function afficherQuestion(){
    verifierVies();
    etat.coffresOouverts = etat.coffresOouverts || [];

    if(mythicActive){
        if(mythicVies <= 0){
            mythicActive = false;
            etat.leconEnCours = null;
            afficherAccueil();
            return;
        }
    } else if(!etat.infiniteLivesActive && etat.vies <= 0){
        alert("Tu as perdu toutes tes vies ! Retour a l'accueil.");
        etat.leconEnCours = null;
        afficherAccueil();
        return;
    }

    const questions = activeQuestions;
    currentSelectedWords = [];
    answered = false;

    if(currentQuestionIndex >= questions.length){
        if(mythicActive){
            let recompense = (10 * currentChapitre.mult) * mythicTotalQuestions;
            etat.diamants += recompense;
            etat.coffresGratuits = (etat.coffresGratuits || 0) + 1;
            etat.mythicCompleted = etat.mythicCompleted || [];
            if(!etat.mythicCompleted.includes(mythicNumLecon)) etat.mythicCompleted.push(mythicNumLecon);
            enregistrerActiviteJournaliere();
            mythicActive = false;
            etat.leconEnCours = null;
            sauvegarder();
            afficherResultatMythique(recompense);
            return;
        }

        etat.diamants += currentLessonDiamonds;
        let maxLecons = getMaxLecons();

        if(etat.leconEnCours === etat.leconActuelle && etat.leconActuelle < maxLecons){
            etat.leconActuelle++;
        }
        enregistrerActiviteJournaliere();
        etat.leconEnCours = null;
        sauvegarder();
        terminerLeconAffichage();
        return;
    }

    const q = questions[currentQuestionIndex];
    const app = document.getElementById("app");
    let progressPct = Math.round((currentQuestionIndex / questions.length) * 100);

    let htmlContent = `
        <div class="top">
            <div>${mythicActive ? '⚡ ' + mythicVies + ' vie' : (etat.infiniteLivesActive ? '❤️ Infini' : '❤️ ' + (etat.vies ?? 3) + '/3')}</div>
            <div style="flex:1; padding:0 4px; background:transparent; box-shadow:none; min-width:100px;">
                <div class="progress-wrap"><div class="progress-bar" style="width:${progressPct}%; ${mythicActive ? 'background:#ea2b2b;' : ''}"></div></div>
            </div>
            <div>${mythicActive ? '' : `<button onclick="acheterSautEnCours()" style="background:none; color:#4b4b4b; border:none; padding:0; cursor:pointer; font-weight:800;">${etat.freeSkips > 0 ? 'Sauter' : '⚡'}</button>`}</div>
        </div>
        <div class="carte">
            <h2>Question ${currentQuestionIndex + 1} / ${questions.length}</h2>
            <p>${q.question}</p>
    `;

    if(q.type === "choice"){
        let optionsMelangees = q.options.map((opt, idx) => ({text: opt, originalIndex: idx}));
        if(q.options.length > 2){
            optionsMelangees.sort(() => Math.random() - 0.5);
        }
        
        optionsMelangees.forEach(item => {
            htmlContent += `<button class="choice-btn" data-original="${item.originalIndex}" onclick="verifierChoix(this, ${item.originalIndex}, ${q.correct}, '${q.options[q.correct].replace(/'/g, "\\'")}')">${item.text}</button>`;
        });
    } else if(q.type === "input"){
        htmlContent += `
            <input type="text" id="user-answer" placeholder="Ta reponse..." />
            <button class="main-btn" onclick="verifierSaisie('${q.correct.replace(/'/g, "\\'")}')">Valider</button>
        `;
    } else if(q.type === "reorder"){
        let wordsHtml = q.words.map((w, idx) => `<button class="choice-btn" id="word-btn-${idx}" onclick="selectionnerMotReordre('${w}', ${idx})">${w}</button>`).join('');
        htmlContent += `
            <div style="background:#f0f0f0; padding:15px; border-radius:15px; margin-bottom:15px; min-height:50px; color:#333; font-weight:bold; font-size:18px;" id="reorder-target">
                Clique sur les mots pour former la phrase...
            </div>
            ${wordsHtml}
            <button class="main-btn" onclick="verifierReordre('${q.correct.replace(/'/g, "\\'")}')">Valider</button>
            <button class="main-btn" style="background:#888; margin-top:5px;" onclick="resetReordre()">Effacer</button>
        `;
    }

    htmlContent += `</div>`;
    app.innerHTML = htmlContent;
}

function tirerRarete(){
    const raretes = [
        {nom:'Commun', couleur:'#9e9e9e', index:0, poidsBase:60},
        {nom:'Rare', couleur:'#2f8fff', index:1, poidsBase:25},
        {nom:'Epique', couleur:'#b24aff', index:2, poidsBase:11},
        {nom:'Legendaire', couleur:'#ffb300', index:3, poidsBase:4}
    ];
    let luck = globalSettings.luckMultiplier || 1;
    let poids = raretes.map((r, i) => i === 0 ? Math.max(5, r.poidsBase - (luck - 1) * 8) : r.poidsBase + (luck - 1) * (i * 3));
    let total = poids.reduce((a, b) => a + b, 0);
    let rand = Math.random() * total;
    let acc = 0;
    for(let i = 0; i < raretes.length; i++){
        acc += poids[i];
        if(rand <= acc) return raretes[i];
    }
    return raretes[0];
}

function appliquerRecompenseCoffre(rarete){
    let luck = globalSettings.luckMultiplier || 1;
    let rareteMult = [1, 2, 4, 8][rarete.index] || 1;
    let rand = Math.floor(Math.random() * 10000) + 1;
    let recompenseTexte = "";

    if(rand <= 30){
        let minutes = 15 * rareteMult;
        etat.infiniteLivesActive = true;
        etat.infiniteLivesExpiry = Date.now() + (minutes * 60 * 1000);
        recompenseTexte = minutes + " minutes de vies illimitees";
    } else if(rand <= 150){
        let qte = rarete.index + 1;
        etat.gelSerie1J += qte;
        recompenseTexte = qte + " Gel(s) de serie";
    } else if(rand <= 500){
        let qte = rarete.index + 1;
        etat.freeSkips += qte;
        recompenseTexte = qte + " Passe(s) de niveau";
    } else if(rand <= 2500){
        if(etat.vies < 3){
            etat.vies = Math.min(3, etat.vies + 1);
            recompenseTexte = "1 vie en plus";
        } else {
            let d = Math.round(15 * rareteMult * luck);
            etat.diamants += d;
            recompenseTexte = d + " diamants (vies deja au maximum)";
        }
    } else {
        let diamondRand = Math.floor(1000 * (1 - Math.sqrt(Math.random())));
        if(diamondRand < 1) diamondRand = 1;
        diamondRand = Math.round(diamondRand * luck * rareteMult);
        etat.diamants += diamondRand;
        recompenseTexte = diamondRand + " diamants";
    }

    return recompenseTexte;
}

function finaliserCoffreNode(i){
    let rarete = tirerRarete();
    let texte = appliquerRecompenseCoffre(rarete);
    etat.coffresOouverts = etat.coffresOouverts || [];
    etat.coffresOouverts.push(i);
    sauvegarder();

function gererErreur(){
    erreursLecon++;
    if(mythicActive){
        mythicVies = 0;
    } else {
        let perte = currentChapitre ? currentChapitre.pertemult : 1;
        currentLessonDiamonds = Math.max(0, currentLessonDiamonds - perte);
        if(!etat.infiniteLivesActive){
            etat.vies = (etat.vies ?? 3) - 1;
            if(etat.vies <= 0){
                etat.vies = 0;
            }
            etat.dernierePerteVie = Date.now();
        }
    }
    sauvegarder();
}

function showFeedback(isCorrect, correctText){
    const existing = document.getElementById('feedback-banner');
    if(existing) existing.remove();
    const app = document.getElementById("app");
    const banner = document.createElement('div');
    banner.className = 'feedback-banner ' + (isCorrect ? 'correct' : 'incorrect');
    banner.id = 'feedback-banner';
    banner.innerHTML = `
        <div class="fb-text">
            <div class="fb-title">${isCorrect ? 'Bien joue ! 🎉' : 'Oups !'}</div>
            ${!isCorrect && correctText ? `<div class="fb-sub">La bonne reponse : ${correctText}</div>` : ''}
        </div>
        <button onclick="continuerApresFeedback()">Continuer</button>
    `;
    app.appendChild(banner);
}

function continuerApresFeedback(){
    const banner = document.getElementById('feedback-banner');
    if(banner) banner.remove();
    if(typeof pendingAction === 'function'){
        let action = pendingAction;
        pendingAction = null;
        action();
    }
}

function apresReponse(estCorrect){
    if(estCorrect){
        pendingAction = () => { currentQuestionIndex++; afficherQuestion(); };
        return;
    }
    gererErreur();
    pendingAction = () => {
        if(mythicActive){
            if(mythicVies <= 0){
                mythicActive = false;
                etat.leconEnCours = null;
                sauvegarder();
                afficherEchecMythique();
                return;
            }
            afficherQuestion();
            return;
        }
        if(!etat.infiniteLivesActive && etat.vies <= 0){
            etat.leconEnCours = null;
            afficherAccueil();
            return;
        }
        afficherQuestion();
    };
}

function selectionnerMotReordre(word, idx){
    currentSelectedWords.push(word);
    document.getElementById(`word-btn-${idx}`).style.display = 'none';
    document.getElementById('reorder-target').innerText = currentSelectedWords.join(' ');
}

function resetReordre(){
    currentSelectedWords = [];
    afficherQuestion();
}

function verifierReordre(correct){
    if(answered) return;
    answered = true;
    let reponseUtilisateur = currentSelectedWords.join(' ').trim().toLowerCase();
    let solution = correct.trim().toLowerCase();
    let estCorrect = (reponseUtilisateur === solution);
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    apresReponse(estCorrect);
    showFeedback(estCorrect, estCorrect ? '' : correct);
}

function verifierChoix(btnEl, selected, correct, correctText){
    if(answered) return;
    answered = true;
    document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; b.style.pointerEvents = 'none'; });
    let estCorrect = (selected === correct);
    if(estCorrect){
        btnEl.classList.add('is-correct');
    } else {
        btnEl.classList.add('is-incorrect');
        const correctBtn = document.querySelector(`.choice-btn[data-original="${correct}"]`);
        if(correctBtn) correctBtn.classList.add('is-correct');
    }
    apresReponse(estCorrect);
    showFeedback(estCorrect, estCorrect ? '' : correctText);
}

function verifierSaisie(correctAnswer){
    if(answered) return;
    answered = true;
    const inputEl = document.getElementById("user-answer");
    const userInput = inputEl.value.trim().toLowerCase();
    let solution = correctAnswer.trim().toLowerCase();
    let estCorrect = (userInput === solution);
    inputEl.disabled = true;
    apresReponse(estCorrect);
    showFeedback(estCorrect, estCorrect ? '' : correctAnswer);
}

    return 12500;

function acheterBoutique(article){
    shopErrorMsg = "";
    if(article === 'gel1'){
        if(etat.diamants >= 25000){
            etat.diamants -= 25000;
            etat.gelSerie1J++;
            sauvegarder();
            alert("Achat reussi : Gel 1 jour ajoute !");
            ouvrirBoutique();
        } else {
            shopErrorMsg = "Pas assez de diamants";
            ouvrirBoutique();
        }
    } else if(article === 'gel2'){
        if(etat.diamants >= 45000){
            etat.diamants -= 45000;
            etat.gelSerie2J++;
            sauvegarder();
            alert("Achat reussi : Gel 2 jours ajoute !");
            ouvrirBoutique();
        } else {
            shopErrorMsg = "Pas assez de diamants";
            ouvrirBoutique();
        }
    } else if(article === 'saut'){
        let price = getLevelSkipPrice();
        if(etat.diamants >= price){
            etat.diamants -= price;
            etat.freeSkips++;
            etat.levelSkipPurchases = (etat.levelSkipPurchases || 0) + 1;
            sauvegarder();
            alert("Achat reussi : Saut de niveau ajoute !");
            ouvrirBoutique();
        } else {
            shopErrorMsg = "Pas assez de diamants";
            ouvrirBoutique();
        }
    } else if(article === 'vie1'){
        if(etat.vies >= 3 && !etat.infiniteLivesActive){
            shopErrorMsg = "Tu as deja toutes tes vies !";
            ouvrirBoutique();
            return;
        }
        if(etat.diamants >= 5000){
            etat.diamants -= 5000;
            etat.vies = Math.min(3, etat.vies + 1);
            sauvegarder();
            alert("+1 vie ajoutee !");
            ouvrirBoutique();
        } else {
            shopErrorMsg = "Pas assez de diamants";
            ouvrirBoutique();
        }
    } else if(article === 'viesFull'){
        if(etat.vies >= 3 && !etat.infiniteLivesActive){
            shopErrorMsg = "Tu as deja toutes tes vies !";
            ouvrirBoutique();
            return;
        }
        if(etat.diamants >= 14500){
            etat.diamants -= 14500;
            etat.vies = 3;
            sauvegarder();
            alert("Vies rechargees completement !");
            ouvrirBoutique();
        } else {
            shopErrorMsg = "Pas assez de diamants";
            ouvrirBoutique();
        }
    } else if(article === 'repareSerie'){
        if(!(etat.streakBroken && etat.feu === 0)){
            ouvrirBoutique();
            return;
        }
        if(etat.diamants >= 20000){
            etat.diamants -= 20000;
            etat.feu = etat.previousStreakValue || 1;
            etat.streakBroken = false;
            etat.lastActiveDate = dateStr(new Date());
            sauvegarder();
            alert("Serie reparee ! Tu es de retour a " + etat.feu + " jour(s) de serie.");
            ouvrirBoutique();
        } else {
            shopErrorMsg = "Pas assez de diamants";
            ouvrirBoutique();
        }
    }
}

            <p>Vies : <b>${etat.infiniteLivesActive ? 'Infini' : (etat.vies ?? 3) + '/3'}</b></p>
            <p>Gel de serie (1J) : <b>❄️ ${etat.gelSerie1J}</b></p>
            <p>Gel de serie (2J) : <b>❄️ ${etat.gelSerie2J}</b></p>
            <p>Serie : <b>🔥 ${etat.feu} jour(s)</b></p>
            <p>Sauts gratuits : <b>${etat.freeSkips}</b></p>
            <p>Coffres gratuits : <b>🎁 ${etat.coffresGratuits || 0}</b></p>
            <p>Lecons Mythique reussies : <b>👑 ${(etat.mythicCompleted || []).length}</b></p>
            <p>Lecon actuelle : <b>${etat.leconActuelle} / ${maxLecons}</b></p>
            <button class="main-btn" onclick="afficherSetup()">Modifier profil</button>
            <div style="height:10px;"></div>
            <button class="main-btn" style="background:#ff4444;" onclick="reinitialiserDonnees()">Reinitialiser</button>
        </div>
    `;
}

function reinitialiserDonnees(){
    if(confirm("Veux-tu vraiment reinitialiser ?")){
        etat.pseudo = "";
        localStorage.removeItem("maLangueEtat");
        mettreAJourNavigation();
        afficherSetup();
    }
}
</script>

</body>
</html>
